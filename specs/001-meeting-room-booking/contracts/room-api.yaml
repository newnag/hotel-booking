openapi: 3.0.3
info:
  title: Room Management API
  description: Back-office API endpoints for managing meeting rooms
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/admin
    description: Local development
  - url: https://hotel-booking.example.com/api/admin
    description: Production

paths:
  /rooms:
    get:
      summary: List all meeting rooms
      description: Get all meeting rooms with filtering and pagination
      tags:
        - Room Management
      security:
        - bearerAuth: []
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: min_capacity
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Paginated list of rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeetingRoom'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '403':
          description: Forbidden - staff role required

    post:
      summary: Create a new meeting room
      description: Add a new meeting room to the system
      tags:
        - Room Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - max_capacity
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: "Diamond Room"
                description:
                  type: string
                  nullable: true
                  example: "Premium meeting space with city view"
                max_capacity:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  example: 40
                location:
                  type: string
                  nullable: true
                  maxLength: 255
                  example: "6th Floor"
                is_active:
                  type: boolean
                  default: true
                theme_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '201':
          description: Room created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MeetingRoom'
                  message:
                    type: string
                    example: "Meeting room created successfully"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Forbidden - admin role required

  /rooms/{id}:
    get:
      summary: Get room details
      description: Retrieve detailed information about a specific room
      tags:
        - Room Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Room details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MeetingRoomDetailed'
        '404':
          description: Room not found

    put:
      summary: Update meeting room
      description: Update room information and configuration
      tags:
        - Room Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                max_capacity:
                  type: integer
                  minimum: 1
                  maximum: 1000
                location:
                  type: string
                  nullable: true
                is_active:
                  type: boolean
                theme_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Room updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MeetingRoom'
                  message:
                    type: string
                    example: "Meeting room updated successfully"
        '422':
          description: Validation error
        '404':
          description: Room not found
        '403':
          description: Forbidden - admin role required

    delete:
      summary: Delete meeting room
      description: Soft delete a meeting room (preserves historical bookings)
      tags:
        - Room Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Room deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Meeting room deleted successfully"
        '409':
          description: Cannot delete room with active bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cannot delete room with active or upcoming bookings"
        '404':
          description: Room not found
        '403':
          description: Forbidden - admin role required

  /themes:
    get:
      summary: List all decoration themes
      description: Get all available decoration themes
      tags:
        - Room Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of themes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DecorationTheme'

    post:
      summary: Create decoration theme
      description: Add a new decoration theme
      tags:
        - Room Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: "Modern Minimalist"
                description:
                  type: string
                  nullable: true
                  example: "Clean, contemporary design"
                preview_image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Theme created successfully
        '422':
          description: Validation error
        '403':
          description: Forbidden - admin role required

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MeetingRoom:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        max_capacity:
          type: integer
        location:
          type: string
          nullable: true
        is_active:
          type: boolean
        themes:
          type: array
          items:
            $ref: '#/components/schemas/DecorationTheme'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MeetingRoomDetailed:
      allOf:
        - $ref: '#/components/schemas/MeetingRoom'
        - type: object
          properties:
            total_bookings:
              type: integer
              description: Total number of bookings for this room
            upcoming_bookings:
              type: integer
              description: Number of upcoming confirmed bookings
            next_booking:
              type: object
              nullable: true
              properties:
                booking_ref:
                  type: string
                start_datetime:
                  type: string
                  format: date-time
                end_datetime:
                  type: string
                  format: date-time

    DecorationTheme:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        preview_image:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        to:
          type: integer
        total:
          type: integer

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
